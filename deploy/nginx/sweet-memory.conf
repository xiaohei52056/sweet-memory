# 星河回忆 Nginx 配置片段
# 用法：把本文件内容并入你现有 server(80) 块，或 include 到 http{} 下的站点配置中。
# 你的博客已在同一 server 块里（/my-blog/ → 8081），本项目追加以下两段即可。

# 1) 前端静态站点：构建产物 frontend/dist 解压到此目录
location / {
    root /opt/sweet-memory/web;
    index index.html;
    try_files $uri $uri/ /index.html;   # Vue history 路由回退
}

# 2) 后端 API：反代到 Spring Boot(8082)
location /api/ {
    proxy_pass http://127.0.0.1:8082;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 200m;          # 批量上传大图
}

# 3) 照片/语音静态文件：Nginx 直接托管磁盘目录（不经 Spring，省内存且快）
location /uploads/ {
    alias /opt/sweet-memory/data/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}
