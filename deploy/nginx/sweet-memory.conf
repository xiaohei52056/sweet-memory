# 星河回忆 Nginx 配置片段（子路径部署：/mem/）
# 用法：把下面三段并入你现有 server(80) 块内，然后 nginx -t && nginx -s reload
# 与博客（/my-blog/ → 8081）互不影响，共用同一个 server。
#
# 约定目录：dist 构建产物放到 /opt/sweet-memory/web/mem/
#   这样 URL /mem/xxx 由 root 自然映射到 /opt/sweet-memory/web/mem/xxx

# 1) 前端静态站点（子路径 /mem/）
location /mem/ {
    root /opt/sweet-memory/web;
    index index.html;
    try_files $uri $uri/ /mem/index.html;   # Vue history 路由回退
}

# 2) 后端 API：/mem/api/* → Spring Boot 的 /api/*
location /mem/api/ {
    proxy_pass http://127.0.0.1:8082/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 200m;              # 批量上传大图
    proxy_read_timeout 120s;
}

# 3) 照片/语音静态文件：Nginx 直接托管磁盘目录（不经 Spring，省内存且快）
location /mem/uploads/ {
    alias /opt/sweet-memory/data/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# 对应的前端构建命令（构建时注入子路径）：
#   VITE_BASE=/mem/ VITE_API_BASE=/mem/api npm run build
# 对应的后端环境变量（sweet-memory.env）：
#   APP_PUBLIC_BASE=/mem/uploads
